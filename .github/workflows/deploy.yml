name: Deploy al droplet

on:
  push:
    branches: [main]
    paths:
      - "addons/**"
      - "config/**"
      - "deploy/**"
      - "docker-compose.prod.yml"
      - ".github/workflows/deploy.yml"
      # La documentacion se publica en /docs: sin esto, un cambio de texto
      # nunca llegaba al servidor.
      - "README.md"
      - "docs/**"
      - "tests/**"
  # Los pull requests se validan pero no se despliegan (ver "desplegar").
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Dos deploys pisandose dejarian el modulo a medio actualizar.
  group: deploy-droplet
  cancel-in-progress: false

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar validadores
        run: pip install --quiet libsass

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Las mismas validaciones que se corren en local antes de subir.
      - name: Validaciones
        run: bash scripts/validar.sh

  desplegar:
    needs: validar
    # Solo un push a main despliega; un pull request se queda en validar.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Abrir sesion SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Fijamos la huella del servidor en vez de aceptar cualquiera.
          echo "${{ secrets.DROPLET_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Desplegar
        run: |
          ssh -i ~/.ssh/id_ed25519 \
              root@${{ secrets.DROPLET_HOST }} \
              'cd /opt/admin-panel && ./deploy/deploy.sh'
